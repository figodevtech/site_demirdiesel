<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão | Demir Diesel</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --background: #f8fafc;
        --foreground: #0f172a;
        --muted: #64748b;
        --primary: #0a7aac;
        --border: #e2e8f0;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 20px;
        border-top: 4px solid var(--primary);
        box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.25);
        padding: 32px 24px 24px;
        text-align: center;
      }
      .logo { width: 132px; height: auto; display: block; margin: 0 auto 24px; }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(10, 122, 172, 0.1); color: var(--primary);
      }
      h1 { font-size: 22px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0; }
      .context {
        margin-top: 16px; padding: 12px 14px; border-radius: 12px; text-align: left;
        background: #f1f5f9; color: var(--foreground); font-size: 14px; line-height: 1.45;
      }
      .context[hidden] { display: none; }
      .actions { display: grid; gap: 10px; margin-top: 24px; }
      button, .link-button {
        appearance: none; border: 0; cursor: pointer; text-decoration: none;
        min-height: 48px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        -webkit-tap-highlight-color: transparent;
      }
      button { background: var(--primary); color: #fff; box-shadow: 0 8px 16px -8px rgba(10, 122, 172, 0.6); }
      button:active, .link-button:active { transform: scale(0.98); }
      .link-button { background: transparent; color: var(--primary); border: 1px solid var(--border); }
      .cached { width: 100%; max-width: 420px; }
      .cached[hidden] { display: none; }
      .cached h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--muted); margin: 0 0 8px 4px;
      }
      .cached ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .cached a {
        display: block; padding: 14px 16px; border-radius: 12px; background: var(--card);
        border: 1px solid var(--border); color: var(--foreground); text-decoration: none;
        font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .status { font-size: 13px; color: var(--muted); min-height: 1em; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <img class="logo" src="/brand/demir-logo.avif" alt="Demir Diesel" width="256" height="99" />
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>Parece que você está offline. Verifique sua conexão e tente novamente.</p>
      <p class="context" id="context" hidden></p>
      <div class="actions">
        <button type="button" id="retry">Tentar novamente</button>
        <a class="link-button" href="/">Ir para o início</a>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <section class="cached" id="cached" hidden aria-labelledby="cached-title">
      <h2 id="cached-title">Disponível offline</h2>
      <ul id="cached-list"></ul>
    </section>

    <script>
      (function () {
        var path = location.pathname;
        var context = document.getElementById("context");
        var messages = [
          [/^\/(checkout|sucesso)/, "O checkout precisa de internet para confirmar preço, estoque e pagamento com segurança. Seu carrinho continua salvo neste aparelho."],
          [/^\/(login|registro)/, "Entrar ou criar sua conta precisa de conexão com a internet."],
          [/^\/(conta|pedidos|enderecos|favoritos)/, "Por segurança, os dados da sua conta só aparecem com conexão ativa."],
        ];
        for (var i = 0; i < messages.length; i++) {
          if (messages[i][0].test(path)) {
            context.textContent = messages[i][1];
            context.hidden = false;
            break;
          }
        }

        var status = document.getElementById("status");
        function retry() {
          status.textContent = "Tentando reconectar...";
          location.reload();
        }
        document.getElementById("retry").addEventListener("click", retry);
        window.addEventListener("online", retry);

        // Lista páginas públicas já visitadas que estão disponíveis offline.
        if (!("caches" in window)) return;
        caches.keys().then(function (keys) {
          var pageCache = keys.filter(function (key) { return key.indexOf("demir-pages-") === 0; })[0];
          if (!pageCache) return;
          return caches.open(pageCache).then(function (cache) {
            return cache.keys().then(function (requests) {
              var recent = requests.slice(-6).reverse();
              return Promise.all(recent.map(function (request) {
                return cache.match(request).then(function (response) {
                  return response ? response.text() : "";
                }).then(function (html) {
                  var url = new URL(request.url);
                  return { href: url.pathname + url.search, title: labelFor(url, html) };
                });
              }));
            });
          });
        }).then(function (pages) {
          if (!pages || !pages.length) return;
          var list = document.getElementById("cached-list");
          pages.forEach(function (page) {
            if (page.href === path + location.search) return;
            var item = document.createElement("li");
            var link = document.createElement("a");
            link.href = page.href;
            link.textContent = page.title;
            item.appendChild(link);
            list.appendChild(item);
          });
          if (list.children.length) document.getElementById("cached").hidden = false;
        }).catch(function () {});

        function labelFor(url, html) {
          var labels = {
            "/": "Página inicial",
            "/produtos": url.search ? "Catálogo (busca/filtro salvo)" : "Catálogo de peças",
            "/buscar": "Buscar peças",
            "/carrinho": "Carrinho",
            "/duvidas-frequentes": "Dúvidas frequentes",
            "/fale-conosco": "Fale conosco",
            "/politica-de-privacidade": "Política de privacidade",
            "/trocas-e-devolucoes": "Trocas e devoluções",
          };
          var path = url.pathname.replace(/\/$/, "") || "/";
          if (labels[path]) return labels[path];
          var match = /<title[^>]*>([^<]*)<\/title>/i.exec(html);
          return match ? decode(match[1].replace(/\s*\|\s*Demir Diesel.*$/i, "")) : path;
        }

        function decode(text) {
          var el = document.createElement("textarea");
          el.innerHTML = text;
          return el.value.trim();
        }
      })();
    </script>
  </body>
</html>
